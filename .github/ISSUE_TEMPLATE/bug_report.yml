name: Bug Report
description: Report a bug in CareCompass
title: "[Bug]: "
labels: ["bug"]
body:
  - type: checkboxes
    id: data-safety
    attributes:
      label: Data Safety Check
      description: Please confirm before submitting
      options:
        - label: I did not include real patient data in this report.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What happened? What did you expect to happen?
      placeholder: "Describe the bug clearly..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the bug?
      placeholder: |
        1. Paste text...
        2. Click...
        3. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: synthetic-input
    attributes:
      label: Synthetic Input (if applicable)
      description: Paste a synthetic (not real) example that triggers the bug.
      placeholder: "Use synthetic/fake data only."

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Other
    validations:
      required: false
